name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: make setup

      - name: 运行 lint 门禁
        run: make lint

  test:
    name: 测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: make setup

      - name: 运行 test 门禁
        run: make test
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: 生成覆盖率报告
        run: pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: 构建
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: make setup

      - name: 运行 build 门禁
        run: make build

  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装安全扫描依赖
        run: |
          pip install bandit[toml] pip-audit

      - name: 运行 Bandit 静态安全扫描
        run: bandit -r src/ -ll -x tests/

      - name: 运行依赖漏洞扫描
        run: pip-audit --desc --progress-spinner=off

  pr-description:
    name: PR 描述检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 检查 PR 描述是否完整
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const requiredSections = ['背景', '变更摘要', '测试计划'];
            const missingSections = requiredSections.filter(s => !body.includes(s));
            if (missingSections.length > 0) {
              core.setFailed(`PR 描述缺少以下必填部分：${missingSections.join(', ')}`);
            }
