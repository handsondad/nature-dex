name: Sync Local Issues

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 同步模式（sync/read/write）
        required: true
        default: sync
        type: choice
        options:
          - sync
          - read
          - write
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  issues: write

jobs:
  sync-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 GitHub CLI
        run: |
          type -p gh >/dev/null || (
            sudo apt update &&
            sudo apt install gh -y
          )

      - name: 同步 issues 目录与 GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: ${{ github.event.inputs.mode || 'sync' }}
        run: bash scripts/create_issues.sh

      - name: 提交本地 issues 目录变化
        if: ${{ github.event.inputs.mode != 'write' }}
        run: |
          if git diff --quiet --exit-code -- issues; then
            echo "没有 issues 目录变更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add issues
          git commit -m "chore(issues): sync local issues"
          git push
